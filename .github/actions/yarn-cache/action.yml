name: Cache the Yarn download cache
description: >-
  Restore and save Yarn's global download cache. Jobs that get Node and Yarn
  from the development shell rather than `actions/setup-node` lose the caching
  that action did as a side effect; this puts it back, on its own, so that
  fetching the same packages again is not the price of moving to Nix.

  Only the download cache is shared: `yarn install` still links `ui/node_modules`
  in each job, exactly as it did before.

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('ui/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
