name: Cache Go build and module caches
description: >-
  Restore and save `GOCACHE` and `GOMODCACHE`. Jobs that get their Go toolchain
  from the development shell rather than `actions/setup-go` lose the caching
  that action did as a side effect; this puts it back, on its own, so that
  compiling the same packages again is not the price of moving to Nix.

  Nix caches derivations, not incremental Go builds, so this stays GitHub-native.

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        # A build cache is only usable by the compiler that wrote it, and the
        # compiler comes from the flake, so its lock file belongs in the key.
        key: ${{ runner.os }}-go-${{ hashFiles('flake.lock', 'go.mod') }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ hashFiles('flake.lock', 'go.mod') }}-
