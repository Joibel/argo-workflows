name: Docs

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ProperDocs, cspell, typos, markdownlint and the Go used to generate docs
      # all come from the development shell, so a docs build that passes locally
      # passes here.
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/go-cache
      # Use the same make target both locally and on CI to make it easier to debug failures.
      - name: Build & Lint docs
        run: nix develop --command make docs
      # If linters auto-fix issues, files will be changed. If so, fail the build.
      - name: Check if linters made changes
        run: git diff --exit-code
      # Upload the site so reviewers see it.
      - name: Upload Docs Site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: site
          if-no-files-found: error
